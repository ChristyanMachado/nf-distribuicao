services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    init: true
    restart: unless-stopped
    stop_grace_period: 5m
    shm_size: "1gb"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - worker-downloads:/app/downloads
      - worker-logs:/app/logs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  worker-downloads:
  worker-logs:
